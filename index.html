<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLO HIGH ASB A&B's Leaderboard</title>

    <!-- BLACK & GOLD THEME STYLING -->
    <style>
        :root {
            --gold: #D4AF37;
            --black: #111111;
            --dark-grey: #1a1a1a;
        }

        body {
            background-color: var(--black);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--dark-grey);
            padding: 30px;
            border-radius: 10px;
            border-top: 5px solid var(--gold);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--gold);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h2 {
            color: #cccccc;
            font-size: 1.2rem;
            font-weight: 300;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        th {
            background-color: var(--gold);
            color: var(--black);
            text-transform: uppercase;
            font-weight: bold;
        }

        tr:hover {
            background-color: #2a2a2a;
        }

        /* Top 3 Highlighting */
        tr:nth-child(1) td { color: var(--gold); font-weight: bold; font-size: 1.1em; }
        tr:nth-child(2) td { color: #C0C0C0; font-weight: bold; } /* Silver */
        tr:nth-child(3) td { color: #CD7F32; font-weight: bold; } /* Bronze */
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>SLO HIGH ASB A&B's</h1>
            <h2>Points Leaderboard</h2>
        </header>
        
        <table id="leaderboard">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Student Name</th>
                    <th>Total Points</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                <tr><td colspan="3">Loading leaderboard...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- JAVASCRIPT: FETCHES CSV, SORTS BY POINTS, AND BUILDS TABLE -->
    <script>
        // PASTE YOUR PUBLISHED GOOGLE SHEET CSV LINK HERE
        const sheetUrl = https://docs.google.com/spreadsheets/d/e/2PACX-1vRRmEdeO15K37xeVjvyVr8KZ0UZItNr4i4NB8aY9y2vGSeH5mWDyWjK0vSc6vObz-Ufa2z1nFBMIXGG/pubhtml;

        async function fetchLeaderboardData() {
            try {
                const response = await fetch(sheetUrl);
                const data = await response.text();
                
                // Split CSV into rows
                const rows = data.split('\n').map(row => row.split(','));
                let students = [];

                // Loop through rows (skip header at index 0)
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    
                    // Ensure the row has at least 3 columns (Name, Email, Points)
                    if (row.length >= 3 && row[0].trim() !== '') {
                        const name = row[0].replace(/"/g, '').trim();
                        // Column index 2 is A&B's points; convert to number for sorting
                        const points = parseInt(row[2].replace(/"/g, '').trim()) || 0;

                        students.push({ name, points });
                    }
                }

                // Sort students automatically from highest points to lowest points
                students.sort((a, b) => b.points - a.points);

                const tableBody = document.getElementById('leaderboard-body');
                tableBody.innerHTML = '';

                // Build the table rows dynamically
                students.forEach((student, index) => {
                    const rank = index + 1;
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${rank}</td>
                        <td>${student.name}</td>
                        <td>${student.points}</td>
                    `;
                    tableBody.appendChild(tr);
                });

            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('leaderboard-body').innerHTML = '<tr><td colspan="3">Error loading leaderboard data.</td></tr>';
            }
        }

        fetchLeaderboardData();
    </script>
</body>
</html>
